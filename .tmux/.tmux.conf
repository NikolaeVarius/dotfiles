# remap prefix from to backtick
unbind C-b
set -g prefix `
bind ` send-prefix

# set shell
set -g default-shell /bin/zsh

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Terminal / mouse capability fixes for xfce4-terminal (xterm-256color lacks XT flag)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:mouse"
set -g set-clipboard on

# Pane border label (pane-border-format needs pane-border-status to actually show)
set -g pane-border-status bottom
set -g pane-border-format "#P: #{pane_current_command}"
set -g pane-border-lines single
#set -g pane-border-status topset -g pane-border-format "#P: #{pane_current_command}"
if-shell "uname | grep -q Darwin" "set-option -g default-command \"reattach-to-user-namespace -l zsh\""

# Split Pane in non dumb way
bind v split-window -h
bind h split-window -v
unbind '"'
unbind %

# Easy Switch
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Theme
set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'powerline/block/blue'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

set -g pane-border-style fg=black
set -g pane-active-border-style fg=brightred

# Tabs
set -g status-position top
set -g renumber-windows on
bind-key -n C-t new-window
bind-key -n C-T new-window -c "#{pane_current_path}"
bind-key -n C-w kill-pane

set -g history-limit 50000

setw -g mouse on
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# Linux clipboard (swap to pbcopy on macOS if needed)
if-shell "uname | grep -q Darwin" \
    "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
    "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# Keeping this for now for testing
# bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set -g set-titles on
set -g set-titles-string "#T"

# Scroll Wheel
bind -T root WheelUpPane   if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"

# TPM must load AFTER all @plugin lines are declared, and only once
run '~/.tmux/plugins/tpm/tpm'